apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "push-relay.fullname" . }}
  labels:
    {{- include "push-relay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "push-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push-relay.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Service-link variables for a Service named like the service's variable prefix would
      # land in its environment for no reason.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: push-relay
          image: "{{ .Values.image.repository }}:{{ include "push-relay.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            # Where server.metrics_addr listens; the ingress never routes to it.
            - name: metrics
              containerPort: 9090
          env:
            - name: TICKET_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ticketKeys.existingSecret }}
                  key: {{ .Values.ticketKeys.existingSecretKey }}
            {{- if .Values.fcmKey.existingSecret }}
            - name: PUSH_RELAY_FCM_KEY_PATH
              value: /secrets/fcm/service-account.json
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config-custom
              readOnly: true
            - name: apns-key
              mountPath: /secrets/apns
              readOnly: true
            {{- if .Values.fcmKey.existingSecret }}
            - name: fcm-key
              mountPath: /secrets/fcm
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "push-relay.fullname" . }}-config
        - name: apns-key
          secret:
            secretName: {{ .Values.apnsKey.existingSecret }}
            items:
              - key: {{ .Values.apnsKey.existingSecretKey }}
                path: AuthKey.p8
        {{- if .Values.fcmKey.existingSecret }}
        - name: fcm-key
          secret:
            secretName: {{ .Values.fcmKey.existingSecret }}
            items:
              - key: {{ .Values.fcmKey.existingSecretKey }}
                path: service-account.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
